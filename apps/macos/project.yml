name: DoppelScreen

options:
  bundleIdPrefix: net.sharkpp
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # 文言は i18n/*.yaml が正で、Sources/Resources/<言語>.lproj は生成物（SPEC.md §11-7）。
  # 言語の選択は OS に任せるため、基準言語だけ宣言する
  developmentLanguage: ja

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  # libwebrtc のビルド済み xcframework（docs/STACK.md §2.1）。
  # エンコーダの挙動が遅延に直結するため、版は明示的に固定して意図的に上げる。
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 151.0.0
  # ビューアページの配信とシグナリング（docs/STACK.md §2.4）。
  # HTTP と WebSocket アップグレードを 1 ポートで扱える。
  # 版は明示的な判断として扱う。生成物である .xcodeproj ごと Package.resolved が
  # gitignore されるため、固定はここで行う（docs/STACK.md §6.4）
  SwiftNIO:
    url: https://github.com/apple/swift-nio
    exactVersion: 2.101.3
  # TLS は Network.framework 経由で使う。BoringSSL を抱え込まない
  SwiftNIOTransportServices:
    url: https://github.com/apple/swift-nio-transport-services
    exactVersion: 1.28.0
  # SAN 付きの自己署名証明書をコードで生成する（docs/STACK.md §2.4）
  SwiftCertificates:
    url: https://github.com/apple/swift-certificates
    exactVersion: 1.13.0

targets:
  DoppelScreen:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: WebRTC
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOHTTP1
      - package: SwiftNIO
        product: NIOWebSocket
      - package: SwiftNIOTransportServices
        product: NIOTransportServices
      - package: SwiftCertificates
        product: X509
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.sharkpp.doppelscreen
        PRODUCT_NAME: DoppelScreen
        # TCC（画面収録）は署名でアプリの同一性を判定する。ad-hoc 署名では
        # ビルドのたびに cdhash が変わって許可が失効するため、安定した署名 ID を使う。
        # 証明書は `make macos-dev-certificate` で作る。
        # Apple Development 証明書を用意したらここを差し替える。
        CODE_SIGN_IDENTITY: "DoppelScreen Development"
        CODE_SIGN_STYLE: Manual
        # Xcode 16 の SwiftUI プレビュー用 dylib。Team ID を持たない自己署名では
        # 本体と Team ID が食い違い、dyld が読み込みを拒否して起動時にクラッシュする
        ENABLE_DEBUG_DYLIB: NO
        # 画面収録とローカルサーバ待受はサンドボックスと両立しない（SPEC.md §6.1）
        ENABLE_APP_SANDBOX: NO
      configs:
        # hardened runtime のライブラリ検証は「本体と同じ Team ID」を要求する。
        # 自己署名証明書は Team ID を持たないため、同じ ID で再署名した
        # WebRTC.framework すら読み込めず起動時にクラッシュする。
        # Apple Development / Developer ID 証明書に移行したら Debug でも YES に戻せる。
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    scheme:
      testTargets:
        - DoppelScreenTests
    # ビューアはコード署名の前に置く必要があるため、全ビルドフェーズの後に走らせる
    postBuildScripts:
      - name: ビューアをビルドしてバンドルへ入れる
        basedOnDependencyAnalysis: false
        script: '"$PROJECT_DIR"/scripts/build-viewer.sh'
      # 依存のライセンス表示は配布の条件（THIRD-PARTY-NOTICES.md）。
      # リリースのときだけ入れると忘れるので、開発ビルドから同じ形で入れる
      - name: ライセンス表示をバンドルへ入れる
        basedOnDependencyAnalysis: false
        script: '"$PROJECT_DIR"/scripts/bundle-licenses.sh'
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: DoppelScreen
        CFBundleDisplayName: DoppelScreen
        # メニューバー常駐。Dock アイコンもアプリメニューも持たない。
        # 「◯◯ について」は OS が用意しないため自前で持つ（AboutView）
        LSUIElement: true
        # assets/icon/doppelscreen.svg から `make icon` で作る生成物
        CFBundleIconFile: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 sharkpp.net"

  # 実機も画面収録の許可も要らない層だけを確かめる（SPEC.md §11-6）。
  # **アプリをテストホストにしない** — 起動すると UI と TCC が絡み、CI に載らなくなる。
  # 代わりにソースをこのバンドルへ直接取り込む（同一モジュールなので internal に届く）。
  DoppelScreenTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources
        # @main を持つ。テストバンドルに入れられない
        excludes:
          - "App/**"
      - path: Tests
    dependencies:
      - package: WebRTC
      - package: SwiftNIO
        product: NIOCore
      - package: SwiftNIO
        product: NIOHTTP1
      - package: SwiftNIO
        product: NIOWebSocket
      - package: SwiftNIOTransportServices
        product: NIOTransportServices
      - package: SwiftCertificates
        product: X509
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.sharkpp.doppelscreen.tests
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
